name: "Controller compatibility"
description: "Report a controller, profile or player-assignment issue."
title: "[Controller]: "
body:
  - type: markdown
    attributes:
      value: >-
        Use a small, redacted reproduction record. Do not attach ROMs, BIOS files,
        saves, complete configuration directories or unfiltered diagnostic archives.
        Remove usernames, private paths, IP/MAC addresses and credentials.
  - type: input
    id: version
    attributes:
      label: "Application / package version"
      description: "Version shown in the app and package filename if known; no full local path."
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: "Windows environment"
      description: "Windows version/build and x64; do not include account or computer names."
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: "Play mode"
      description: "Select the affected area."
      options:
        - "Title / Settings"
        - "Solo"
        - "Local VS"
        - "LAN VS"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Controller and adapter"
      description: "Model, hardware revision if known, adapter version and USB/Bluetooth connection."
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: "Selected profile and player"
      description: "Gamepad or Twin-Stick profile, P1/P2, and whether reconnect/claim was involved."
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: "Affected inputs"
      description: "Left/right lever directions, weapon/dash/Start, simultaneous input and release-to-neutral behavior."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Number the smallest steps; include how often the problem repeats."
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: "Expected and actual result"
      description: "What should happen, what happened, and any short redacted error text."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Optional relevant evidence"
      description: "Small redacted excerpts or approved images only; never include game or firmware archives."
    validations:
      required: false
